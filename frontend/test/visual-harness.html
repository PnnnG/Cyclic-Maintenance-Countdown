<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cyclic Countdown visual harness</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #dfe5ec; }
      main { display: grid; gap: 28px; max-width: 1260px; margin: auto; }
      section { padding: 24px; border-radius: 32px; display: grid; grid-template-columns: repeat(2, minmax(300px,1fr)); gap: 18px; }
      h2 { grid-column: 1/-1; margin: 0; font-size: 15px; opacity: .65; text-transform: uppercase; letter-spacing: .08em; }
      ha-card { display: block; }
      ha-icon { display: grid; place-items: center; width: 34px; height: 34px; font-size: 22px; }
      .light { --card-background-color: #fff; --ha-card-background: rgba(255,255,255,.95); --primary-background-color: #f5f7fa; --secondary-background-color: #edf0f5; --primary-text-color: #1f242b; --secondary-text-color: #6f7884; --divider-color: #ccd2d9; --primary-color: #6078df; --warning-color: #c98516; --error-color: #d15f59; --success-color: #3f9663; background: #f5f7fa; color: #1f242b; }
      .dark { --card-background-color: #202229; --ha-card-background: #202229; --primary-background-color: #111319; --secondary-background-color: #292c35; --primary-text-color: #f4f5f7; --secondary-text-color: #aeb4be; --divider-color: #3a3e47; --primary-color: #8b91f1; --warning-color: #e2aa43; --error-color: #e57770; --success-color: #58b47d; background: #111319; color: #f4f5f7; }
      .glass { --card-background-color: rgba(26,29,45,.38); --ha-card-background: rgba(31,35,52,.46); --primary-background-color: #151a2b; --secondary-background-color: #252b42; --ha-card-backdrop-filter: blur(18px) saturate(135%); --ha-card-border-color: rgba(255,255,255,.18); --ha-card-box-shadow: 0 16px 34px rgba(2,5,16,.28), inset 0 1px rgba(255,255,255,.06); --primary-text-color: #f7f8ff; --secondary-text-color: rgba(232,235,255,.7); --divider-color: rgba(255,255,255,.16); --primary-color: #9a8cff; --warning-color: #f0b956; --error-color: #ef7d75; --success-color: #67c48d; background: radial-gradient(circle at 15% 0,#824e91 0,transparent 38%), radial-gradient(circle at 90% 90%,#274b8f 0,transparent 46%), #111522; color: #fff; }
      @media (max-width: 720px) { body { padding: 12px; } section { padding: 14px; border-radius: 22px; grid-template-columns: 1fr; } }
    </style>
    <script>
      customElements.define("ha-card", class extends HTMLElement {});
      customElements.define("ha-icon", class extends HTMLElement {
        set icon(value) { this.textContent = value?.includes("bacteria") ? "⚙" : value?.includes("filter") ? "✦" : "◈"; }
      });
    </script>
    <script type="module" src="/custom_components/cyclic_countdown/frontend/cyclic-countdown-card.js?v=0.1.5"></script>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
      const phases = [
        ["normal", 13], ["warning", 1], ["due", 0], ["overdue", -3],
      ];
      const themes = ["light", "dark", "glass"];
      const root = document.querySelector("#root");
      await customElements.whenDefined("cyclic-countdown-card");
      for (const theme of themes) {
        const section = document.createElement("section");
        section.className = theme;
        section.innerHTML = `<h2>${theme} theme</h2>`;
        for (let index = 0; index < phases.length; index++) {
          const [phase, remaining] = phases[index];
          const taskId = `${theme}-${phase}`;
          const state = {
            entity_id: `sensor.${taskId}`,
            state: String(remaining),
            attributes: {
              task_id: taskId, name: index === 3 ? "Очень длинное название обслуживания контейнера" : "Бактерии",
              icon: index % 2 ? "mdi:air-filter" : "mdi:bacteria", interval_days: 14,
              last_completed_date: "2026-08-10", due_date: "2026-08-24", warning_days: 1,
              remaining_days: remaining, elapsed_progress: Math.min(1, Math.max(0, (14 - remaining) / 14)), phase,
            },
          };
          const card = document.createElement("cyclic-countdown-card");
          card.setConfig({
            type: "custom:cyclic-countdown-card", task_id: taskId,
            style: index % 2 ? "fill" : "bar", reverse_progress: index === 1,
            confirm_complete: true, show_secondary: true, secondary_info: index % 2 ? "due_date" : "last_completed",
            config_version: 2, width: "standard", tap_action: "more-info", hold_action: "complete", double_tap_action: "none",
          });
          card.hass = { language: "ru", locale: { language: "ru-RU" }, states: { [state.entity_id]: state }, connection: { sendMessagePromise: async () => state.attributes } };
          section.append(card);
        }
        root.append(section);
      }
    </script>
  </body>
</html>
