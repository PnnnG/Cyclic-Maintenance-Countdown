name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - homeassistant: "2026.7.0"
            pytest_homeassistant: "0.13.344"
          - homeassistant: "2026.8.1"
            pytest_homeassistant: "0.13.355"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: >-
          pip install
          "homeassistant==${{ matrix.homeassistant }}"
          "pytest-homeassistant-custom-component==${{ matrix.pytest_homeassistant }}"
          pytest pytest-asyncio pytest-cov ruff
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: >-
          pytest
          --cov=custom_components/cyclic_countdown
          --cov-report=term-missing
          --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run typecheck
        working-directory: frontend
      - run: pnpm run lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - name: Verify the committed frontend bundle is current
        run: >-
          git diff --exit-code --
          custom_components/cyclic_countdown/frontend/cyclic-countdown-card.js
          custom_components/cyclic_countdown/frontend/cyclic-countdown-card.js.map

  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
      - uses: hacs/action@main
        with:
          category: integration
